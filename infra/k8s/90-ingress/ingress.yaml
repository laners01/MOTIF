# 외부 진입점.
#
# 흐름: 인터넷 -> Traefik(TLS 종단, 443) -> Service
#
# 경로 분배는 앱 쪽 Ingress 가 각자 들고 있다 — `/api` 는 40-core-api/ingress.yaml,
# `/admin` 은 40-core-api/ingress-admin.yaml(IP 제한 포함), `/project/` 는
# 50-jenkins-webhook/. **애플리케이션 게이트웨이(SCG)는 두지 않는다** — Traefik 이
# core-api 로 직결하고 인증은 앱의 Spring Security 가 한다(ADR-0009).
# 여기 남은 whoami 는 Walking Skeleton 검증용으로 아직 `/` 를 받고 있다.
#
# 인증서는 cert-manager가 letsencrypt-prod로 발급해 motif-tls Secret에 저장하며,
# 만료 30일 전 자동 갱신한다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: traefik/whoami:v1.10
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - j15d104.p.ssafy.io
      secretName: motif-tls
  rules:
    - host: j15d104.p.ssafy.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
