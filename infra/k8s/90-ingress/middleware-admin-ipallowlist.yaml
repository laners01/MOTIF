# /admin 네트워크 수준 접근 제한 — 테일넷·팀 IP 만.
#
# ── 현재 어느 라우터에도 걸려 있지 않다 (2026-09-13 결정) ───────────────────
# 리소스는 남기되 `40-core-api/ingress-admin.yaml` 이 참조하지 않는다.
# 이유: `ipAllowList` 는 **403 밖에 내지 못한다.** 403 은 "경로는 있는데 못
# 들어온다"를 알려줘 어드민 화면의 존재를 드러내는데, §1.1 요건은 **404** 다.
# 같은 판정을 앱의 `AdminIpFilter` 가 404 로 내므로 제한은 그대로이고 노출만
# 사라진다 — 실측으로 403 → 404 전환을 확인했다.
#
# **다시 붙이기 전에 읽을 것**: 붙이면 공인망에서 `/admin` 이 403 으로 드러난다.
# 엣지 방어를 한 겹 더 원한다면 그 트레이드오프를 알고 하는 것이어야 한다.
# 아래 sourceRange 는 그때를 위해 유지한다.
#
# ADR-0009(SCG 제거)로 어드민 **인증**은 core-api 의 Spring Security 가 맡고,
# **IP 제한**은 여기 엣지로 옮겨졌다. 앱에 IP 제한을 두면 프록시 뒤의
# 클라이언트 IP 를 헤더로 신뢰해야 하므로 Traefik 의 일로 남긴다.
#
# ── 쓰기 전에 반드시 확인할 것 ──────────────────────────────────────────────
# ipAllowList 는 **Traefik 이 보는 출발지 IP** 로 판단한다. k3s 는 servicelb
# (klipper-lb)가 DNAT + MASQUERADE 로 트래픽을 넘기므로, Traefik 이 실제
# 클라이언트 IP 대신 클러스터 내부 IP(10.42.x.x)를 볼 수 있다. 그 경우 이
# 목록은 "아무도 못 들어옴" 아니면 "전부 들어옴" 중 하나로 **조용히** 잘못
# 동작한다 — 그래서 관측 없이 이 파일을 방어선으로 믿으면 안 된다.
#
# 관측 (팀원 기기에서, hello/whoami 가 살아 있는 동안):
#
#   curl -s https://j15d104.p.ssafy.io/ | grep -iE 'RemoteAddr|X-Forwarded-For'
#   curl -s https://ifconfig.me; echo        # 내 공인 IP
#
# 두 값이 같으면 아래 sourceRange 가 의도대로 동작한다.
#
# 앞쪽에 10.42.x.x 가 보이면 SNAT 된 것이다. 2026-09-13 에 실제로 그랬다.
#
# **해결은 externalTrafficPolicy 가 아니다** — 그 값은 넣어 봤지만 klipper-lb 가
# 무시하고 계속 MASQUERADE 했다(출발지가 svclb 파드 IP 로 바뀔 뿐). 실제 해결은
# `90-ingress/helmchartconfig-traefik.yaml` 의 **hostPort 직결 + service.spec.type:
# ClusterIP** 다. 적용 후 앱 로그의 ip= 가 공인 IP 와 일치하는 것을 확인했다.
#
# 그래도 원 IP 가 안 오면 IP 로는 막을 수 없으므로 **경로 자체를 공인 도메인에서
# 내린다** — `40-core-api/ingress-admin.yaml` 을 지우고 테일넷으로만 접근한다
# (`kubectl port-forward svc/core-api 8081:8081` 또는 노드 테일넷 IP 직접
# 호출). 그것이 ADR-0009 가 예고한 "어드민 테일넷 전용" 방향이기도 하다.
#
# 10.42.0.0/16 을 목록에 넣어 "통하게" 만들지 않는다 — 클러스터 내부 IP 를
# 허용하는 것은 SNAT 된 모든 외부 요청을 허용하는 것과 같다(= 제한 없음).
#
# 필드명은 Traefik v3(= k3s 내장) 기준 `ipAllowList` 다. v2.9 미만이라면
# `ipWhiteList` 로 써야 조용히 무시되지 않는다 — 버전 확인:
#   kubectl -n kube-system get deploy traefik -o jsonpath='{..image}'; echo
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ipallowlist
spec:
  ipAllowList:
    sourceRange:
      # 테일넷 (Tailscale CGNAT 대역). 팀원 기기가 같은 계정으로 조인돼 있다
      # — infra/README.md §1.
      - 100.64.0.0/10
      # 팀 공인 IP 는 값이 확인된 뒤 추가한다. 교육장/자택 IP 는 바뀌므로
      # 고정하면 어느 날 조용히 잠긴다(webhook-migration.md §3 의 GitLab IP
      # 와 같은 함정). 예:
      # - 203.0.113.7/32      # SSAFY 교육장 egress
