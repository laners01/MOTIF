# 어드민 감사 로그 볼륨 (어드민 명세 §1.3).
#
# app-core-api 의 logback ADMIN_AUDIT 어펜더가 /var/log/motif 에 쓴다
# (backend/app-core-api/src/main/resources/logback-spring.xml).
#
# ── 이 볼륨이 없으면 파드가 기동하지 않는다 ─────────────────────────────────
# 어펜더가 파일을 못 열면 Logback 이 ERROR status 를 남기고, Spring Boot 의
# LogbackLoggingSystem 이 그걸 보고 IllegalStateException 으로 기동을 끊는다.
# Tomcat 이 뜨기 전이라 9081 startupProbe 가 connection refused 로 실패하고
# CrashLoopBackOff 가 된다. 2026-09-13 빌드 29~33 이 이 이유로 연속 실패했다.
# "로그 파일 하나 못 쓰는 것" 이 기동 실패로 번지는 구조라는 점을 기억할 것.
#
# emptyDir 이 아니라 PVC 인 이유: 감사 로그는 파드 재시작에도 남아야 한다(§1.3).
# 용량은 maxHistory 90일치 JSON 기준이다 — 어드민 조작 로그라 양이 적다.
#
# postgres-pvc 와 같은 local-path 주의사항이 그대로 적용된다. 노드 로컬
# 디스크이므로 노드가 사라지면 감사 로그도 함께 사라진다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-api-audit-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
