# 이 파일은 "어떤 키가 필요한지"만 알리는 예시다. 실제 값은 절대 커밋하지 않는다.
# base64는 인코딩일 뿐 암호화가 아니므로, 값이 든 Secret 매니페스트는
# Git에 올리는 순간 평문 유출과 같다.
#
# 실제 생성은 서버에서 명령으로 한다(값은 팀 비밀 저장소 참조):
#
#   kubectl create secret generic postgres-secret \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=CORE_APP_PASSWORD='...' \
#     --from-literal=NOTIF_APP_PASSWORD='...'
#
# 주의사항
#   - 세 계정의 비밀번호는 서로 다르게 둔다. 같으면 계정 격리 설계가 무의미해진다.
#   - 작은따옴표(')는 초기화 SQL 문자열을 깨뜨리므로 사용하지 않는다.
#   - 여러 줄로 나눌 때 역슬래시 뒤에 공백이 있으면 셸이 줄을 잇지 못한다.
#     붙여넣기가 불안하면 한 줄로 실행한다.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: <REDACTED>
  CORE_APP_PASSWORD: <REDACTED>
  NOTIF_APP_PASSWORD: <REDACTED>
