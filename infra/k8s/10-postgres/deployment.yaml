# PostgreSQL 16 단일 인스턴스.
#
# RDS 대신 클러스터 내부에 두는 이유(아키텍처 설계서 v0.3 반영 예정):
#   - 지급 서버가 15Gi/4vCPU로 확인되어 "램 부족" 전제가 사라졌다.
#   - 계정이 다른 RDS는 VPC 피어링이 없어 DB 트래픽이 공인 인터넷을 경유한다.
#     RabbitMQ를 테일넷에 숨겨두고 DB만 퍼블릭에 노출하는 것은 일관성이 없다.
#   - 크레딧을 아껴 EC2 워커 노드(2노드 클러스터)에 쓴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  # 롤링 업데이트 시 파드 2개가 같은 볼륨을 잡는 것을 막는다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: motif
            - name: POSTGRES_USER
              value: postgres
            # 마운트 지점 바로 아래가 아닌 하위 디렉터리를 데이터 디렉터리로 쓴다.
            # 볼륨 루트에 lost+found 등이 있으면 초기화가 실패하기 때문이다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # POSTGRES_PASSWORD / CORE_APP_PASSWORD / NOTIF_APP_PASSWORD
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1500Mi"
              cpu: "1000m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "motif"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "motif"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
