# RabbitMQ 토폴로지 선언(definitions.json).
#
# 큐·익스체인지·바인딩을 기동 시 한 번에 적용한다. 관리 UI에서 손으로 만들면
# 서버를 다시 세울 때 재현이 안 되므로 토폴로지도 코드로 관리한다.
#
# 계정과 권한은 이 파일에 없다. 비밀번호가 디스크에 평문으로 남지 않도록
# 기동 후 init Job이 rabbitmqctl로 생성한다(job-init-users.yaml).
#
# 설계 근거(아키텍처 설계서 §5.4 / §6):
#   - topic exchange 하나(motif.topic)로 잡 큐와 도메인 이벤트를 모두 처리한다.
#     Kafka를 쓰지 않은 이유: 리플레이가 불필요하고, 우선순위 큐가 필요하며,
#     램 제약이 있다.
#   - job.composite는 x-max-priority=10. 모티프(유료, 결제 직후)는 5,
#     챌린지는 0으로 발행하여 돈을 낸 사용자를 먼저 처리한다.
#   - 모든 큐는 DLX(motif.dlx)로 연결한다. 실패 메시지는 DLQ에 쌓이고
#     잡 스윕 배치가 attempt<3이면 재발행한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
data:
  definitions.json: |
    {
      "rabbit_version": "3.13.0",
      "users": [],
      "vhosts": [
        {
          "name": "/motif"
        }
      ],
      "permissions": [],
      "topic_permissions": [],
      "exchanges": [
        {
          "name": "motif.topic",
          "vhost": "/motif",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "motif.dlx",
          "vhost": "/motif",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        }
      ],
      "queues": [
        {
          "name": "job.composite",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-max-priority": 10,
            "x-dead-letter-exchange": "motif.dlx",
            "x-dead-letter-routing-key": "dlq.job.composite"
          }
        },
        {
          "name": "job.media",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "motif.dlx",
            "x-dead-letter-routing-key": "dlq.job.media"
          }
        },
        {
          "name": "evt.core",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "motif.dlx",
            "x-dead-letter-routing-key": "dlq.evt.core"
          }
        },
        {
          "name": "evt.notification",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "motif.dlx",
            "x-dead-letter-routing-key": "dlq.evt.notification"
          }
        },
        {
          "name": "evt.ranking",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "motif.dlx",
            "x-dead-letter-routing-key": "dlq.evt.ranking"
          }
        },
        {
          "name": "dlq.job.composite",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "dlq.job.media",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "dlq.evt.core",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "dlq.evt.notification",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "dlq.evt.ranking",
          "vhost": "/motif",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        }
      ],
      "bindings": [
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "job.composite",
          "destination_type": "queue",
          "routing_key": "job.composite",
          "arguments": {}
        },
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "job.media",
          "destination_type": "queue",
          "routing_key": "job.media",
          "arguments": {}
        },
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "evt.core",
          "destination_type": "queue",
          "routing_key": "composite.*",
          "arguments": {}
        },
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "evt.notification",
          "destination_type": "queue",
          "routing_key": "composite.*",
          "arguments": {}
        },
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "evt.notification",
          "destination_type": "queue",
          "routing_key": "comment.*",
          "arguments": {}
        },
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "evt.notification",
          "destination_type": "queue",
          "routing_key": "notice.created",
          "arguments": {}
        },
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "evt.notification",
          "destination_type": "queue",
          "routing_key": "challenge.created",
          "arguments": {}
        },
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "evt.ranking",
          "destination_type": "queue",
          "routing_key": "video.*",
          "arguments": {}
        },
        {
          "source": "motif.topic",
          "vhost": "/motif",
          "destination": "evt.ranking",
          "destination_type": "queue",
          "routing_key": "comment.*",
          "arguments": {}
        },
        {
          "source": "motif.dlx",
          "vhost": "/motif",
          "destination": "dlq.job.composite",
          "destination_type": "queue",
          "routing_key": "dlq.job.composite",
          "arguments": {}
        },
        {
          "source": "motif.dlx",
          "vhost": "/motif",
          "destination": "dlq.job.media",
          "destination_type": "queue",
          "routing_key": "dlq.job.media",
          "arguments": {}
        },
        {
          "source": "motif.dlx",
          "vhost": "/motif",
          "destination": "dlq.evt.core",
          "destination_type": "queue",
          "routing_key": "dlq.evt.core",
          "arguments": {}
        },
        {
          "source": "motif.dlx",
          "vhost": "/motif",
          "destination": "dlq.evt.notification",
          "destination_type": "queue",
          "routing_key": "dlq.evt.notification",
          "arguments": {}
        },
        {
          "source": "motif.dlx",
          "vhost": "/motif",
          "destination": "dlq.evt.ranking",
          "destination_type": "queue",
          "routing_key": "dlq.evt.ranking",
          "arguments": {}
        }
      ],
      "policies": [],
      "parameters": [],
      "global_parameters": []
    }
