# RabbitMQ 3.13 (management 포함).
#
# 영속성이 필요한 이유: 합성 잡 메시지가 유실되면 사용자가 올린 영상이
# 처리되지 않은 채 사라진다. durable 큐 + PVC로 재기동 시 메시지를 보존한다.
# (Redis는 반대로 무영속 — 랭킹·캐시는 전부 재계산 가능하다.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_VHOST
              value: "/motif"
            # 부트스트랩 관리자. 이 값을 주면 guest 계정은 만들어지지 않는다.
            - name: RABBITMQ_DEFAULT_USER
              value: "admin"
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq/mnesia
            - name: conf
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
        - name: conf
          configMap:
            name: rabbitmq-conf
        - name: definitions
          configMap:
            name: rabbitmq-definitions
---
# 클러스터 내부용. 애플리케이션은 rabbitmq.default.svc.cluster.local:5672로 붙는다.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
# 외부(테일넷) 노출용.
#   - 5672 : 대여 GPU 워커가 테일넷으로 접속한다. 설계서 §7대로 공개 포트는 없다.
#   - 15672: 관리 UI. 큐 적체 시연(Phase 4 DoD)에 사용한다.
# 공인 IP(3.36.61.156)로는 열리지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-tailnet
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  externalIPs:
    - 100.106.64.43
