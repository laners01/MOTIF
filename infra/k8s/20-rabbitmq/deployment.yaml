# RabbitMQ 3.13 (management 포함).
#
# 영속성이 필요한 이유: 합성 잡 메시지가 유실되면 사용자가 올린 영상이
# 처리되지 않은 채 사라진다. durable 큐 + PVC로 재기동 시 메시지를 보존한다.
# (Redis는 반대로 무영속 — 랭킹·캐시는 전부 재계산 가능하다.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            # vhost 는 definitions.json 이 만들지만, 정의 파일이 빠지는
            # 구성 변화에도 vhost 만은 남도록 이중으로 지정한다.
            - name: RABBITMQ_DEFAULT_VHOST
              value: "/motif"
            # RABBITMQ_DEFAULT_USER 는 쓰지 않는다. load_definitions 가
            # 설정되어 있으면 RabbitMQ 는 파일에 users 가 있든 없든
            # 기본 계정 시딩을 통째로 건너뛴다(빈 PVC 부팅으로 실측 확인).
            # 계정은 전부 postStart 훅이 만든다 — admin 포함.
          # 나머지 계정 비밀번호를 postStart 훅과 수동 작업에서 쓸 수 있도록 주입한다.
          envFrom:
            - secretRef:
                name: rabbitmq-secret
          lifecycle:
            # 컴포넌트별 계정과 권한 생성.
            #
            # Job(rabbitmqadmin) 대신 postStart 훅(rabbitmqctl)을 쓰는 이유:
            # rabbitmqadmin 은 HTTP API 인증이 필요한데, admin 계정 생성이
            # 실패하면 Job 이 영원히 인증에 실패하는 순환에 빠진다.
            # rabbitmqctl 은 같은 컨테이너의 Erlang 노드에 직접 붙으므로
            # 인증이 필요 없다.
            #
            # 멱등하다. 계정이 있으면 add_user 가 실패하므로 || true 로 넘기고
            # change_password 로 항상 Secret 값에 맞춘다. 권한은 덮어써진다.
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    set -eu

                    # 1) 쿠키 경쟁 방지 — 훅은 root, 서버는 rabbitmq 유저.
                    #    훅의 rabbitmqctl 이 먼저 실행되면 쿠키를 root 소유로 만들어
                    #    서버가 자기 쿠키를 읽지 못하고 죽는다(eacces).
                    for i in $(seq 1 90); do
                      [ -s /var/lib/rabbitmq/.erlang.cookie ] && break
                      sleep 2
                    done

                    # 2) Erlang 노드 응답 대기. 단 ping 은 노드 프로세스 확인일 뿐
                    #    rabbit 앱 부팅 완료가 아니다 — 이 시점에 add_user 를 부르면
                    #    "app not running" 으로 전부 실패한다(실측).
                    for i in $(seq 1 90); do
                      rabbitmqctl -q ping >/dev/null 2>&1 && break
                      sleep 2
                    done

                    # 3) rabbit 앱 부팅 + definitions 임포트 완료까지 대기
                    rabbitmqctl await_startup --timeout 120

                    # 4) 계정 생성. admin 도 여기서 만든다 —
                    #    load_definitions 사용 시 RABBITMQ_DEFAULT_USER 가 무시되기 때문.
                    #    add_user 는 이미 있으면 실패하므로 || true, 비밀번호는
                    #    change_password 로 항상 Secret 값에 맞춘다(멱등).
                    for u in admin core-api notification gpu-worker; do
                      rabbitmqctl add_user "$u" placeholder 2>/dev/null || true
                    done
                    rabbitmqctl change_password admin        "$RABBITMQ_ADMIN_PASSWORD"
                    rabbitmqctl change_password core-api     "$RABBITMQ_CORE_PASSWORD"
                    rabbitmqctl change_password notification "$RABBITMQ_NOTIF_PASSWORD"
                    rabbitmqctl change_password gpu-worker   "$RABBITMQ_GPU_PASSWORD"

                    rabbitmqctl set_user_tags admin administrator
                    rabbitmqctl set_permissions -p /motif admin ".*" ".*" ".*"

                    # 권한: configure / write / read — configure 가 "^$" 인 이유는
                    # 토폴로지를 definitions.json 이 관리하므로 앱이 큐를 선언할 필요가 없어서다.
                    rabbitmqctl set_permissions -p /motif core-api     "^$" "^motif\.(topic|dlx)$" "^evt\.core$"
                    rabbitmqctl set_permissions -p /motif notification "^$" "^$"                   "^evt\.notification$"
                    rabbitmqctl set_permissions -p /motif gpu-worker   "^$" "^motif\.topic$"       "^job\.composite$"

                    rabbitmqctl set_topic_permissions -p /motif core-api   motif.topic ".*"                          ".*"
                    rabbitmqctl set_topic_permissions -p /motif gpu-worker motif.topic "^composite\.(done|failed)$" "^job\.composite$"

                    # 자기 검증 — 아래가 실패하면 훅이 실패해 파드 이벤트에 드러난다.
                    # set -e 가 있으므로 위 어느 단계의 실패도 조용히 넘어가지 않는다.
                    rabbitmqctl -q list_users | grep -q '^admin'
                    echo "user provisioning done"
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq/mnesia
            - name: conf
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
        - name: conf
          configMap:
            name: rabbitmq-conf
        - name: definitions
          configMap:
            name: rabbitmq-definitions
---
# 클러스터 내부용. 애플리케이션은 rabbitmq.default.svc.cluster.local:5672 로 붙는다.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
# 외부(테일넷) 노출용.
#   - 5672 : 대여 GPU 워커가 테일넷으로 접속한다. 설계서 §7 대로 공개 포트는 없다.
#   - 15672: 관리 UI. 큐 적체 시연(Phase 4 DoD)에 사용한다.
# 공인 IP(3.36.61.156)로는 열리지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-tailnet
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  externalIPs:
    - 100.106.64.43
