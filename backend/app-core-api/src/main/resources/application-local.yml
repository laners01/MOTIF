# 격리 모드 — DB·MQ 모두 backend/local-infra compose (ADR-0003)
# 자격증명은 로컬 compose 전용 더미(비밀 아님). prod는 비밀 fallback 금지.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motif}
    username: ${DB_USERNAME:core_app}
    password: ${DB_PASSWORD:motif123}
  rabbitmq:
    host: localhost
    port: 5672
    username: motif
    password: motif
    virtual-host: /motif
  data:
    redis:
      host: localhost
      port: 6379
      password: motif123        # 로컬 compose 전용 더미(비밀 아님)

# GOOGLE_CLIENT_ID 는 안드로이드 파트의 OAuth 클라이언트 ID다(비밀 아님, aud 검증용).
# 미설정이면 앱은 뜨지만 /api/v1/auth/login/google 만 500으로 거부된다 —
# 인증과 무관한 기능 개발을 막지 않기 위한 선택. 값은 backend/.env 에 둔다.
motif:
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    jwt:
      secret: ${JWT_SECRET:motif-local-dev-only-jwt-secret-not-a-real-key-32bytes+}   # 로컬 전용 더미(비밀 아님, HS256 최소 32바이트)

logging:
  level:
    org.hibernate.SQL: debug   # SQL debug는 local만
