# motif_core 스키마 마이그레이션 master (MODERA 관례 — ADR-0004).
#
# 번호 붙은 raw SQL changelog를 순서대로 include 한다:
#
#   databaseChangeLog:
#     - include:
#         file: db/changelog/sql/0001-create-composite-jobs.sql
#     - include:
#         file: db/changelog/sql/0002-....sql
#
# 규칙:
#   - 파일명은 0001부터 증가. 한 번 배포된 파일은 수정하지 않는다(새 번호로 추가).
#   - 전역 오브젝트(pg_trgm 등)는 여기 두지 않는다 — DB init 스크립트 소유.
#   - 팬아웃 GRANT(subscriptions SELECT to notif_app)는 subscriptions 생성
#     직후의 changeSet으로 이 changelog에 들어온다 (configmap-init.yaml 참조).
# 스키마 계약: backend/docs/erd/MOTIF_DB_SPEC_v0_15.md
# 수동 선행 SQL(스키마·계정·GRANT USAGE·pg_trgm): backend/docs/db/manual-prereq.sql
