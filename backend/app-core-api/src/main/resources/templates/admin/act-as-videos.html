<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: page('참여 영상 대행', ~{::main})}">
<body>
<!--/* 참여 영상 탐색 + 댓글 스레드 대행 (ADMIN-11 · §3.12.1·3.12.2). 로직은 act-as-videos.js. */-->
<main>
    <p class="err" id="no-acting" hidden>
        활동 중인 아티스트가 없습니다. <a href="/admin/act-as">활동 대행</a>에서 먼저 고르세요.
    </p>

    <section id="browse" hidden>
        <p>
            <label style="display:inline">챌린지 번호
                <input type="number" id="challenge-seq" min="1" style="width:8em">
            </label>
            <label style="display:inline">작성자 번호
                <input type="number" id="user-seq" min="1" style="width:8em">
            </label>
            <button type="button" id="reload">조회</button>
        </p>
        <p class="err" id="err" hidden></p>

        <table>
            <thead>
            <tr><th>#</th><th></th><th>설명</th><th>작성자</th><th>댓글</th><th>아티스트</th><th></th></tr>
            </thead>
            <tbody id="videos"></tbody>
        </table>
        <p class="muted" id="page-hint"></p>
        <p>
            <button type="button" id="prev" disabled>이전</button>
            <button type="button" id="next" disabled>다음</button>
        </p>

        <p class="muted">
            <strong>PUBLIC 영상만 나온다</strong> — PRIVATE 는 대행 대상이 아니다(ADMIN-11 제약).
            댓글 스레드는 <strong>활동 중 아티스트의 시점</strong>으로 조회한다. 그래서 아티스트
            본인 댓글이 맨 위에 오고(§9.1 정렬 1순위), 삭제 버튼도 본인 댓글에만 붙는다 —
            타인 댓글 삭제는 신고 처리(§3.13)로 한다.
            아티스트가 <strong>자기 챌린지의 영상</strong>에 댓글을 달면 게시물 소유자가 아니라
            팬에게 알림이 간다(자기 행위 규칙은 소유자 본인일 때만 적용).
        </p>
    </section>

    <template id="video-row">
        <tr>
            <td class="seq"></td>
            <td><img class="thumb" alt=""></td>
            <td class="desc"></td>
            <td class="author"></td>
            <td class="comments"></td>
            <td class="badges muted"></td>
            <td>
                <button type="button" class="open">댓글</button>
            </td>
        </tr>
    </template>
    <template id="thread-row">
        <tr class="detail-panel">
            <td colspan="7">
                <div class="thread"></div>
            </td>
        </tr>
    </template>
    <template id="comment-node">
        <div class="comment">
            <p>
                <strong class="who"></strong>
                <span class="body"></span>
                <span class="meta muted"></span>
            </p>
            <p>
                <button type="button" class="replies">답글 펼치기</button>
                <button type="button" class="reply">답글</button>
                <button type="button" class="del">삭제</button>
                <span class="msg muted"></span>
            </p>
            <div class="children"></div>
        </div>
    </template>

    <script src="/admin/act-as-thread.js" defer></script>
    <script src="/admin/act-as-videos.js" defer></script>
</main>
</body>
</html>
