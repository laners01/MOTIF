<!DOCTYPE html>
<!--/*
  어드민 로그인 (어드민 명세 §1.7 · §3.1.1).

  ── layout.html 을 쓰지 않고 스타일·스크립트를 인라인한 이유 ──────────────────
  이 페이지만 permitAll 이다. layout 이 부르는 /admin/admin.css · /admin/admin.js 는
  static/admin/ 에 있어서 어드민 체인의 인증을 그대로 받는다(AdminViewConfig javadoc
  — 밖에 두면 어드민 JS 가 인증 없이 노출된다). 로그인 전에는 그 두 파일이 401 이라
  layout 을 끼우면 스타일이 깨진 화면이 뜬다.

  정적 경로 일부를 인증에서 여는 방법도 있었지만, "어드민 정적 자원은 인증 뒤에
  둔다"는 규칙에 예외를 내는 대신 이 한 화면만 자급자족하게 했다. 로그인 폼은
  input 두 개와 fetch 한 번이라 인라인으로 충분하다.

  IP 제한은 이 페이지에도 걸린다 — 허용 대역 밖에서는 404 다(§1.1, AdminIpFilter).
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MOTIF 어드민 · 로그인</title>
    <style>
        * { box-sizing: border-box; }
        /* 이 화면은 admin.css 를 못 쓴다 — static/admin/ 이 인증 뒤에 있어 로그인 전에는
           401 이다(파일 상단 주석). 그래서 admin.css 와 같은 토큰을 여기에 한 벌 더 둔다.
           양쪽을 함께 고쳐야 로그인 화면만 반대 테마로 남지 않는다. */
        :root {
            color-scheme: light dark;
            --bg: #fff; --fg: #1a1a1a; --line: #ddd; --err-bg: #fde8e8; --err-fg: #a50e0e;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16181c; --fg: #e6e8eb; --line: #333940; --err-bg: #3a1f1f; --err-fg: #f0938c;
            }
        }
        body { margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center;
               background: var(--bg);
               font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--fg); }
        form { width: 300px; padding: 24px; border: 1px solid var(--line); border-radius: 6px; }
        h1 { margin: 0 0 16px; font-size: 18px; }
        label { display: block; margin: 12px 0 4px; }
        input { width: 100%; padding: 6px; font: inherit; }
        button { width: 100%; margin-top: 16px; padding: 7px; font: inherit; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .5; }
        .err { margin: 12px 0 0; padding: 8px 10px; border-radius: 4px;
               background: var(--err-bg); color: var(--err-fg); }
        [hidden] { display: none; }
    </style>
</head>
<body>
<form id="login" autocomplete="on">
    <h1>MOTIF 어드민</h1>
    <label for="loginId">아이디</label>
    <input id="loginId" name="loginId" autocomplete="username" required autofocus>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">로그인</button>
    <p class="err" id="error" hidden></p>
</form>
<script>
    // 로그인 후 첫 화면. 서버가 next 를 받지 않는다 — 미인증 요청은 리다이렉트가
    // 아니라 401 봉투로 끝나므로(REST entry point) next 가 실릴 경로 자체가 없다.
    const HOME = '/admin/challenges/new';

    const form = document.getElementById('login');
    const errorBox = document.getElementById('error');
    const submit = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        // 문구까지 비운다 — hidden 만 되돌리면 직전 실패 문구가 남아 있다가
        // finally 의 `hidden = !textContent` 에서 다시 나타난다.
        errorBox.textContent = '';
        errorBox.hidden = true;
        submit.disabled = true;
        try {
            const res = await fetch('/api/v1/admin/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // 쿠키를 받아야 한다. 같은 오리진이라 기본값으로도 실리지만,
                // 이 폼의 목적이 쿠키 수령이므로 의도를 남긴다.
                credentials: 'same-origin',
                body: JSON.stringify({
                    loginId: form.loginId.value,
                    password: form.password.value
                })
            });
            const body = await res.json();
            if (res.ok && body.result === 'SUCCESS') {
                location.replace(HOME);
                return;
            }
            // 서버 메시지를 그대로 쓴다 — 401 은 ID·PW 를 구분하지 않는 한 문장이고
            // (§3.1.1), 403 은 비활성 안내다. 화면이 다시 지어내면 두 곳이 갈라진다.
            errorBox.textContent = body.message || '로그인에 실패했습니다.';
        } catch (e) {
            errorBox.textContent = '서버에 연결할 수 없습니다.';
        } finally {
            errorBox.hidden = !errorBox.textContent;
            submit.disabled = false;
            form.password.value = '';
        }
    });
</script>
</body>
</html>
