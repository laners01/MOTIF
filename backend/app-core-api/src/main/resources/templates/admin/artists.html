<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: page('아티스트 관리', ~{::main})}">
<body>
<!--/*
  §3.5 목록·등록·수정·삭제. 소속사·그룹 드롭다운은 §3.3.1·§3.4.1 을 부른다.
  등록/수정은 한 폼을 돌려 쓴다 — 필드가 같고, 화면을 두 개 두면 소속사 잠금 규칙을
  두 곳에 써야 한다(§3.5.2). 로직은 artists.js.
*/-->
<main>
    <section>
        <h2>목록</h2>
        <p>
            <label style="display:inline">이름 <input type="search" id="q" placeholder="부분 일치"></label>
            <label style="display:inline">그룹
                <select id="f-group"><option value="">전체</option></select>
            </label>
            <label style="display:inline">소속사
                <select id="f-company"><option value="">전체</option></select>
            </label>
            <label style="display:inline"><input type="checkbox" id="include-deleted"> 삭제분 포함</label>
            <button type="button" id="reload">조회</button>
        </p>
        <p class="err" id="list-err" hidden></p>
        <!--/* 삭제 연쇄 결과(§3.5.5) — 에셋·가격이 함께 꺼진 것을 표에서 바로 보여 준다 */-->
        <p class="msg ok" id="list-msg"></p>
        <table>
            <thead>
            <tr><th>#</th><th>이름</th><th>그룹</th><th>소속사</th><th>구독</th><th>챌린지</th>
                <th>에셋</th><th>공지</th><th>등록</th><th></th></tr>
            </thead>
            <tbody id="artists"></tbody>
        </table>
        <p class="muted" id="count"></p>
    </section>

    <section>
        <h2 id="form-title">아티스트 등록</h2>
        <p class="err" id="form-err" hidden></p>
        <label>이름 <input id="name" maxlength="50" placeholder="users.nickname 이 된다"></label>
        <label>그룹
            <select id="group"><option value="">솔로 (그룹 없음)</option></select>
        </label>
        <label>소속사
            <select id="company"><option value="">선택</option></select>
            <span class="msg muted" id="company-lock" hidden>그룹 소속사로 고정 — 불일치는 서버가 400 으로 막는다 (§3.5.2)</span>
        </label>
        <label>소개 <textarea id="bio" rows="3"></textarea></label>
        <label>프로필 이미지 <input type="file" id="profile" accept="image/*">
            <span class="msg muted">비우면 기존 이미지 유지</span>
        </label>
        <label>모티프 배경 <input type="file" id="motif-bg" accept="image/*">
            <span class="msg muted">비우면 기존 이미지 유지</span>
        </label>
        <ol class="progress">
            <li data-step="upload">이미지 업로드</li>
            <li data-step="submit">저장</li>
        </ol>
        <p>
            <button type="button" id="save">등록</button>
            <button type="button" id="reset" hidden>새 아티스트 등록으로</button>
            <span class="msg ok" id="msg"></span>
        </p>
    </section>

    <template id="artist-row">
        <tr>
            <td class="seq"></td>
            <td class="name"></td>
            <td class="group"></td>
            <td class="company"></td>
            <td class="subscribers"></td>
            <td class="challenges"></td>
            <td class="assets"></td>
            <td class="notices"></td>
            <td class="reg"></td>
            <td class="actions">
                <button type="button" class="edit">수정</button>
                <button type="button" class="delete">삭제</button>
            </td>
        </tr>
    </template>

    <script src="/admin/artists.js" defer></script>
</main>
</body>
</html>
