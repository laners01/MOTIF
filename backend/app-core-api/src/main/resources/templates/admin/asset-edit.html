<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: page('모티프 에셋 수정', ~{::main})}">
<body>
<!--/*
  §3.8.3 상세 · §3.8.4 수정. 에셋만 등록 후 고칠 방법이 없던 것을 메운다.

  등록(asset-new)과 갈라 둔다 — 수정은 "영상을 안 바꾼다" 가 기본이고 그때는
  파일 입력도 규격 검사도 아예 돌지 않아야 한다. 한 화면에 합치면 그 분기가
  폼 안에 들어온다. 등록 화면이 같은 이유로 notice-new/notice-edit 를 따른다.

  아티스트는 바꾸지 않는다(§3.8.4) — 이미 팔린 구매와 만들어진 결과물이 다른
  아티스트 아래로 따라가 운영 지표가 뒤틀린다. 읽기 전용으로 보여만 준다.

  로직은 asset-edit.js.
*/-->
<main>
    <p class="err" id="err" hidden></p>

    <section>
        <h2>1. 대상</h2>
        <p class="muted" id="summary">불러오는 중…</p>
        <img id="thumb" alt="" width="180" hidden>
        <p class="muted" id="thumb-note" hidden>썸네일이 아직 없다 — 가공 후에 보인다.</p>
        <p><video id="current" width="360" controls muted hidden></video></p>
        <p class="muted" id="current-note" hidden></p>
    </section>

    <section>
        <h2>2. 정보</h2>
        <p><label>표시명 <input type="text" id="title" maxlength="100"></label></p>
        <p><label>소개 <input type="text" id="description"></label></p>
        <p>
            <label>타입
                <select id="asset-type">
                    <option value="NORMAL">NORMAL</option>
                    <option value="PREMIUM">PREMIUM</option>
                    <option value="SECRET">SECRET</option>
                </select>
            </label>
        </p>
    </section>

    <section>
        <h2>3. 영상 교체 <span class="muted">— 선택. 고르지 않으면 지금 영상을 그대로 둔다</span></h2>
        <p><input type="file" id="file" accept="video/mp4,video/quicktime"></p>
        <video id="preview" width="360" controls muted hidden></video>
        <p class="muted" id="meta"></p>
        <!--/* 교체본의 썸네일 시각 — 등록 화면과 같은 UI(§4.8). 영상을 고르지 않으면
               열리지 않는다: 이미 가공이 끝난 에셋의 썸네일만 다시 뽑는 길은 없다
               (워커 멱등 가드 — MediaJobProcessor.alreadyDone). */-->
        <div id="thumb-pick" hidden>
            <label>썸네일 시각
                <input type="range" id="thumb-at" min="0" step="0.1" value="1.5">
                <span class="muted" id="thumb-at-label">1.50초</span>
            </label>
            <p class="muted">비워두면 1.5초 지점을 쓴다 — 도입부가 페이드인·검은 화면이면 옮겨라.</p>
        </div>
        <ol class="progress">
            <li data-step="upload">S3 업로드</li>
        </ol>
    </section>

    <section>
        <h2>4. 저장</h2>
        <button type="button" id="submit" disabled>저장</button>
        <a href="/admin/assets">목록</a>
        <p id="result"></p>
    </section>

    <script src="/admin/asset-edit.js" defer></script>
</main>
</body>
</html>
