<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: page('공지 수정', ~{::main})}">
<body>
<!--/* §3.10.3 조회 → §3.10.4 수정. noticeSeq 는 JS 가 경로에서 읽는다. 로직은 notice-edit.js. */-->
<main>
    <p class="err" id="err" hidden></p>
    <p class="muted" id="head"></p>

    <section>
        <h2>본문</h2>
        <textarea id="content" rows="12" maxlength="5000"></textarea>
    </section>

    <section>
        <h2>이미지 <span class="muted">— 끌어서 순서를 바꾼다. 위에서부터 displayOrder 0</span></h2>
        <ul id="images" class="images"></ul>
        <p>
            <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple>
            <span class="muted" id="image-count"></span>
        </p>
        <p class="err" id="replace-warning">저장 시 이미지 목록은 <strong>통째로 교체</strong>된다 — 기존 행을 지우고 지금 목록으로 다시 만든다(§3.10.4). 본문만 고쳤다면 이미지는 건드리지 않는다.</p>
    </section>

    <section>
        <button type="button" id="save">저장</button>
        <a href="/admin/notices">목록</a>
        <p id="result"></p>
    </section>

    <template id="image-item">
        <li draggable="true">
            <img alt="">
            <span class="order muted"></span>
            <button type="button" class="del">삭제</button>
        </li>
    </template>

    <script src="/admin/notice-edit.js" defer></script>
</main>
</body>
</html>
