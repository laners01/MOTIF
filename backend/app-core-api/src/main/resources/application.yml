# 공통 설정 — 프로파일별 접속 정보는 application-{local,local-remote,prod}.yml (ADR-0003)
spring:
  application:
    name: app-core-api
  profiles:
    default: local          # 프로파일 미지정 = 격리 모드
  jpa:
    hibernate:
      ddl-auto: validate    # 전 프로파일 고정 — DDL은 Liquibase 소유 (ADR-0004)
    open-in-view: false
    properties:
      hibernate:
        default_schema: motif_core
        query:
          in_clause_parameter_padding: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: motif_core
    liquibase-schema: motif_core   # DATABASECHANGELOG도 자기 스키마에
    parameters:
      # 어드민 시드 BCrypt 해시 (0015-admin-seed.sql, 부록 B). fallback 을 두지 않는다 —
      # 기본값을 두면 전 배포가 같은 비밀번호로 뜨고, 그게 리포지토리에 남는다.
      # 로컬 프로파일이 개발용 더미로 덮는다.
      adminSeedHash: ${ADMIN_SEED_HASH}
  lifecycle:
    timeout-per-shutdown-phase: 30s

# 인증 (명세 §2, ADR-0009 D2). 비밀값은 프로파일별 파일에서 주입한다.
motif:
  auth:
    jwt:
      # 명세 §2.1 응답 expiresIn: 3600
      access-token-ttl: 1h
      # 명세에 값이 없다 — 기본안. 확정되면 이 줄만 고친다
      refresh-token-ttl: 14d

  # 미디어 — 버킷은 app-media 와 같은 곳을 본다. core-api 는 presign 서명만 하고
  # 바이트는 다루지 않는다(원칙 ① — 브라우저 → S3 직행)
  media:
    s3:
      bucket: ${MOTIF_MEDIA_BUCKET:motif-media}
      region: ${AWS_REGION:ap-northeast-2}

  # 어드민 (어드민 명세 §1.1·§1.2·§1.3·§1.4). 비밀값·허용 IP 는 프로파일별 파일에서 주입한다
  admin:
    # §1.2 — motif_admin 쿠키의 Secure 플래그. 기본은 켬이고 로컬만 끈다(http 개발 서버).
    # TLS 를 Traefik 이 끊어 앱이 보는 스킴은 운영에서도 http 라, 요청으로 판단하지 않는다.
    cookie-secure: true
    jwt:
      # §1.2 — 12시간, refresh 없음(기본안). 만료되면 재로그인
      ttl: 12h
    audit:
      # §1.3 보존 90일(기본안). 경로는 prod 가 PVC 마운트 지점으로 덮는다
      history-days: 90
    media:
      # presign 조건은 서명에 박힌다 — 다른 값으로 PUT 하면 S3 가 거부한다 (§1.4)
      video:
        content-types: video/mp4,video/quicktime
        max-size: 300MB
        presign-ttl: 600s
      image:
        content-types: image/jpeg,image/png,image/webp
        max-size: 10MB
        presign-ttl: 300s
      # 업로드 화면이 보낸 길이·해상도를 대조하는 규칙 (§1.4 2항, §8 #3 미결 — 값만 고친다)
      rules:
        challenge-max-duration: 60s
        asset-max-duration: 20s
        edited-tolerance: 500ms

server:
  port: 8081
  shutdown: graceful

# 가상 스레드는 켜지 않는다 — Phase 4 부하 테스트에서 결정 (ADR-0004)
# spring:
#   threads:
#     virtual:
#       enabled: true

management:
  server:
    port: 9081              # 관리 포트 분리 — 전 모듈 통일 (ADR-0004)
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# springdoc은 기본 경로 유지 (/v3/api-docs, /swagger-ui.html)
