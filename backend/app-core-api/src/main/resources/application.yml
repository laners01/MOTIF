# 공통 설정 — 프로파일별 접속 정보는 application-{local,local-remote,prod}.yml (ADR-0003)
spring:
  application:
    name: app-core-api
  profiles:
    default: local          # 프로파일 미지정 = 격리 모드
  jpa:
    hibernate:
      ddl-auto: validate    # 전 프로파일 고정 — DDL은 Liquibase 소유 (ADR-0004)
    open-in-view: false
    properties:
      hibernate:
        default_schema: motif_core
        query:
          in_clause_parameter_padding: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: motif_core
    liquibase-schema: motif_core   # DATABASECHANGELOG도 자기 스키마에
    parameters:
      # 어드민 시드 BCrypt 해시 (0015-admin-seed.sql, 부록 B). fallback 을 두지 않는다 —
      # 기본값을 두면 전 배포가 같은 비밀번호로 뜨고, 그게 리포지토리에 남는다.
      # 로컬 프로파일이 개발용 더미로 덮는다.
      adminSeedHash: ${ADMIN_SEED_HASH}
  lifecycle:
    timeout-per-shutdown-phase: 30s

# 인증 (명세 §2, ADR-0009 D2). 비밀값은 프로파일별 파일에서 주입한다.
motif:
  auth:
    jwt:
      # 테스트용 30일 (2026-09-14). 명세 §2.1 은 1h(expiresIn: 3600)다.
      #
      # 안드로이드 연동 중 재발급 흐름을 아직 안 붙인 상태라 1시간마다 끊겨
      # 테스트가 막혔다. 그래서 한시적으로 늘린다.
      #
      # 시연 전에 1h 로 되돌린다. 액세스 토큰은 stateless JWT 라 폐기 수단이 없다 —
      # 유출되면 만료까지 그대로 살아 있고, 회원 정지(어드민 §3.14.3)도 refresh
      # 토큰만 폐기한다. 짧은 수명이 그 유일한 방어선이다.
      #
      # 되돌릴 때 재배포가 필요 없도록 환경변수로 뺀다 — configmap 의
      # MOTIF_ACCESS_TOKEN_TTL 을 1h 로 넣고 롤아웃 재시작하면 된다.
      access-token-ttl: ${MOTIF_ACCESS_TOKEN_TTL:30d}
      # 명세에 값이 없다 — 기본안. 확정되면 이 줄만 고친다
      refresh-token-ttl: 14d

  # 미디어 — 버킷은 app-media 와 같은 곳을 본다. core-api 는 presign 서명만 하고
  # 바이트는 다루지 않는다(원칙 ① — 브라우저 → S3 직행)
  media:
    # 보호 등급 signed URL (§1.7). key-pair-id 는 서명 URL 에 실려 나가는 공개
    # 식별자라 기본값을 둔다. private-key 는 비밀이라 fallback 이 없다 —
    # 없으면 기동은 되고 보호 URL 발급만 실패한다(CloudFrontUrlSigner).
    signing:
      key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID:K27QE85H6DLYDD}
      private-key: ${CLOUDFRONT_PRIVATE_KEY:}
      # §1.7 기본안 10분. 만료된 조각을 만나면 앱이 재생목록을 다시 받는다
      ttl: 10m
      # 이미지(썸네일·프로필)는 그 복구 경로가 없다 — <img> 가 403 이면 깨진 채로
      # 남는다. 마이페이지를 열어둔 채 돌아왔을 때 3×3 이 통째로 깨지지 않을 만큼
      image-ttl: 6h
    # 업로드 presign 조건 중 경로를 공유하는 것. 이미지는 어드민 아티스트 프로필과
    # 사용자 프로필(§4.3)이 같은 profiles/ 에 쓰므로 한 곳에 둔다 — 영상은 어드민만
    # 올리므로 motif.admin.media 에 남아 있다
    upload:
      image:
        content-types: image/jpeg,image/png,image/webp
        max-size: 10MB
        # 어드민 §1.4 이미지 300초 · API 명세 §4.3 expiresIn 300 — 같은 값이다
        presign-ttl: 300s
    s3:
      bucket: ${MOTIF_MEDIA_BUCKET:motif-media}
      region: ${AWS_REGION:ap-northeast-2}

  # 아티스트 랭킹 (API 명세 §5.1). 원본 명세는 API 계약만 적고 점수 공식·갱신 주기를
  # 정하지 않았다 — 아래는 전부 S15P21D104-51 기본안이라 코드에 박지 않는다
  ranking:
    weight:
      # 조회 1회 = 1점, 참여 1건 = 100점. 참여는 촬영·업로드를 요구하는 행위라 무겁다
      view: 1
      participant: 100
    # 이만큼 지난 챌린지의 반응은 절반으로 친다. 조회 10,000회를 모은 30일 된 챌린지
    # (×0.2264 = 2,264)가 조회 3,000회짜리 2일 된 챌린지(×0.9057 = 2,717)에 밀린다
    half-life: 14d
    # §1.6 이 클라 캐시 TTL 5분을 "랭킹 배치 주기와 동일" 로 묶어 놨다
    interval: 5m
    # rankDelta 의 대비 구간. interval 과 같게 두면 대비가 한 틱이라 변동이 안 잡힌다.
    # 시연 때는 둘 다 30s/1m 로 낮춰 순위가 움직이는 것을 보여줄 수 있다
    prev-interval: 10m

  # 홈 HOT 참여 영상 랭킹 (API 명세 §6.1). 원본 명세는 Redis 키 이름과 "순서 고정" 만
  # 적고 점수 산출을 정하지 않았다 — 아래는 전부 S15P21D104-113 기본안이다.
  # 점수 = view_count × 0.5^(age/half-life). 항이 하나라 가중치가 없다(상수배는 순위를
  # 바꾸지 못한다)
  hot-video:
    ranking:
      # 이만큼 지난 영상의 조회수는 절반으로 친다. 아티스트 랭킹(14d)보다 짧다 —
      # "실시간 인기" 자리라 어제 것이 오늘 것을 눌러 앉아 있으면 안 된다
      half-life: 2d
      # §1.6 이 홈 캐시 TTL 5분을 "랭킹 배치 주기와 동일" 로 묶어 놨다
      interval: 5m
      # 스냅샷 버전 보존 = 진행 중인 커서 시퀀스의 유효 기간. interval 보다 넉넉해야
      # 스크롤이 배치 한 틱에 끊기지 않는다. 이 시간 넘게 배치가 멈추면 HOT 은 빈
      # 목록이 된다 — 낡은 "실시간" 을 계속 보여 주는 것보다 낫다고 본다
      retain: 15m

  # 어드민 (어드민 명세 §1.1·§1.2·§1.3·§1.4). 비밀값·허용 IP 는 프로파일별 파일에서 주입한다
  admin:
    # §1.2 — motif_admin 쿠키의 Secure 플래그. 기본은 켬이고 로컬만 끈다(http 개발 서버).
    # TLS 를 Traefik 이 끊어 앱이 보는 스킴은 운영에서도 http 라, 요청으로 판단하지 않는다.
    cookie-secure: true
    jwt:
      # §1.2 — 12시간, refresh 없음(기본안). 만료되면 재로그인
      ttl: 12h
    audit:
      # §1.3 보존 90일(기본안). 경로는 prod 가 PVC 마운트 지점으로 덮는다
      history-days: 90
    media:
      # presign 조건은 서명에 박힌다 — 다른 값으로 PUT 하면 S3 가 거부한다 (§1.4)
      video:
        content-types: video/mp4,video/quicktime
        max-size: 300MB
        presign-ttl: 600s
      # 업로드 화면이 보낸 길이·해상도를 대조하는 규칙 (§1.4 2항, §8 #3 미결 — 값만 고친다)
      rules:
        challenge-max-duration: 60s
        asset-max-duration: 3m
        edited-tolerance: 500ms

server:
  port: 8081
  shutdown: graceful

# 가상 스레드는 켜지 않는다 — Phase 4 부하 테스트에서 결정 (ADR-0004)
# spring:
#   threads:
#     virtual:
#       enabled: true

management:
  server:
    port: 9081              # 관리 포트 분리 — 전 모듈 통일 (ADR-0004)
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# springdoc은 기본 경로 유지 (/v3/api-docs/{group}, /swagger-ui.html)
springdoc:
  # 그룹(user·admin)을 나눈 뒤에도 켜 두면 /v3/api-docs 가 둘을 합친 문서를 그대로 뱉는다 —
  # 공인망에 어드민 경로를 흘리던 구멍이 그것이라 끈다. 문서는 그룹 경로로만 나간다.
  enable-default-api-docs: false
  swagger-ui:
    # 그룹 목록의 기본 선택. 끄면 사전순으로 admin 이 먼저 잡혀 공인망에서 401 을 본다
    urls-primary-name: user
