# 영상 전달 PoC 로컬 환경 — nginx origin + netem 하네스.
# 판정 기준·네트워크 프로파일: ../../docs/poc/video-delivery.md
#
# 본 인프라(../docker-compose.yml)와 분리한 이유: PoC 는 PG·MQ 가 필요 없고,
# 측정 중 다른 컨테이너가 같은 네트워크에서 트래픽을 내면 수치가 오염된다.
#
# 영상은 레포에 넣지 않는다 — VIDEO_DIR(.env)로 호스트 폴더를 읽기 전용 마운트한다.
services:
  poc-origin:
    image: nginx:1.27-alpine
    container_name: motif-poc-origin
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${VIDEO_DIR:-./media}:/srv/videos:ro
      - poc-check:/srv/check:ro          # 하네스가 만든 자체검사용 더미
      - ./logs:/var/log/nginx            # 서버 측 진실 — 호스트에서 바로 회수
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 계측 도구함. 상시 서비스가 아니라 exec 대상이라 healthcheck 를 두지 않는다.
  poc-harness:
    build: ./harness
    container_name: motif-poc-harness
    cap_add: [NET_ADMIN]                 # tc netem — 자기 netns 에만 건다
    volumes:
      - ./profiles:/work/profiles:ro
      - ./verify.sh:/work/verify.sh:ro
      - poc-check:/srv/check             # rw — 여기에 더미를 만든다
      - ./logs:/var/log/nginx:ro
    depends_on:
      poc-origin:
        condition: service_healthy
    command: ["sleep", "infinity"]

volumes:
  poc-check:
