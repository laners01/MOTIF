# PoC origin — 정적 서빙 + 요청별 측정 로그.
#
# 로그를 처음부터 CSV 로 찍는다. 변환 스크립트가 필요 없고, 하네스 집계와
# 대조할 서버 측 진실이 바로 나온다.
# 컬럼: time,uri,status,range,body_bytes_sent,request_time
#
# 주의 — request_time 을 체감 시간으로 읽지 말 것. nginx 가 소켓에 다 써 넣은
# 시점까지라서, 대역폭을 수신측(하네스)에서 조이는 우리 구성에서는 실제보다
# 짧게 찍힌다. 실측 예: 같은 요청이 클라이언트 6.83초 / 로그 2.90초.
# 체감 시간은 하네스 수치를 쓰고, 로그는 바이트(body_bytes_sent)의 진실로 쓴다.
log_format poc_csv '$time_iso8601,"$request_uri",$status,"$http_range",$body_bytes_sent,$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.csv poc_csv;

    # 전송 바이트가 파일 바이트와 달라지면 egress 측정이 틀어진다.
    gzip off;

    # 대역폭 제어는 netem 한 곳에서만 한다 — nginx 는 절대 조이지 않는다.
    sendfile on;
    limit_rate 0;

    location = /healthz { return 200 "ok\n"; }

    # 팀 제공 영상. Range 는 nginx 기본 동작이라 별도 설정이 없다.
    # autoindex: 마운트가 비었는지 눈으로 바로 확인하고, 티켓 4 의 feed 목록을 뽑는다.
    location /videos/ {
        alias /srv/videos/;
        autoindex on;
    }

    # netem 자체검사용 더미 — 호스트 영상 폴더·레포와 무관한 공유 볼륨.
    location /check/ { alias /srv/check/; }
}
