# 로컬 RabbitMQ 설정 — load_definitions 방식은 운영(configmap-conf.yaml)과 동일.
# 기동 시 토폴로지(exchange, queue, binding)와 로컬 전용 계정을 일괄 적용한다.
#
# definitions.json 은 운영 configmap-definitions.yaml 토폴로지의 거울이며,
# users/permissions 만 로컬 전용 더미 계정(motif/motif, 비밀 아님)으로 추가했다.
# (운영은 비밀번호가 디스크에 남지 않도록 postStart 훅이 계정을 만든다.)
# JSON은 주석이 불가해 여기 남긴다. 해시 재생성:
#   docker run --rm rabbitmq:3.13-management rabbitmqctl hash_password motif
load_definitions = /etc/rabbitmq/definitions.json

# 관리 UI — localhost:15672 (motif / motif, 로컬 전용 더미)
management.tcp.port = 15672
