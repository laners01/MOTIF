# 버전 결정 근거는 backend/docs/adr/0004.
# Boot 4.0.x / springdoc 3.0.x / querydsl 7.x는 2026-09-02 Maven Central 최신 패치로 핀.

[versions]
spring-boot = "4.0.8"
spring-dependency-management = "1.1.7"
# spring-cloud = "2025.1.3"         # 게이트웨이 재도입 시 활성화 (ADR-0009)
querydsl = "7.6"                    # io.github.openfeign.querydsl — com.querydsl 아님 (ADR-0004)
springdoc = "3.0.3"
jackson2-mq = "2.18.2"              # MQ 직렬화 + jjwt-jackson (Boot 4 REST는 Jackson 3 — ADR-0004/0005)
mapstruct = "1.6.3"
lombok = "1.18.46"
lombok-mapstruct-binding = "0.2.0"
jjwt = "0.13.0"                     # 서비스 access/refresh JWT 발급·검증 (ADR-0009 D2)
aws-sdk = "2.32.14"                 # S3 v2 — app-media 산출물 업로드 (ADR-0010)
firebase-admin = "9.4.3"            # FCM HTTP v1 — 레거시 서버 키는 2024 종료 (§14)

[libraries]
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
aws-cloudfront = { module = "software.amazon.awssdk:cloudfront", version.ref = "aws-sdk" }
querydsl-core = { module = "io.github.openfeign.querydsl:querydsl-core", version.ref = "querydsl" }
querydsl-jpa  = { module = "io.github.openfeign.querydsl:querydsl-jpa",  version.ref = "querydsl" }
querydsl-apt  = { module = "io.github.openfeign.querydsl:querydsl-apt",  version.ref = "querydsl" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2-mq" }
jackson2-jsr310   = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson2-mq" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }   # 버전은 Boot BOM
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
postgresql = { module = "org.postgresql:postgresql" }                                  # 버전은 Boot BOM
jjwt-api     = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwt-impl    = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }  # 버전은 Boot BOM
spring-security-test        = { module = "org.springframework.security:spring-security-test" }         # 버전은 Boot BOM

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version = "1.0.0" }
