# 하이브리드 모드 — DB는 자기 compose, MQ는 서버(테일넷) (ADR-0003)
# SERVER_MQ_PASSWORD는 fallback이 없다 (placeholder 규율, ADR-0004) — 미주입이면
# placeholder 원문이 비밀번호로 남아 서버 MQ 인증에 실패한다(주입 없이는 동작 불가).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motif}
    username: ${DB_USERNAME:notif_app}
    password: ${DB_PASSWORD:motif123}   # 로컬 compose 전용 더미(비밀 아님)
  rabbitmq:
    host: ${SERVER_MQ_HOST:100.106.64.43}
    port: 5672
    username: ${SERVER_MQ_USERNAME:notification}
    password: ${SERVER_MQ_PASSWORD}
    virtual-host: /motif
    listener:
      simple:
        # 서버 큐를 구독하는 컨슈머를 로컬에서 띄우지 않는다 — 같은 큐를 여럿이
        # 물면 라운드로빈으로 서버 알림 서비스의 이벤트를 로컬이 삼킨다 (ADR-0003).
        # 컨슈머까지 통합하려면 개인 vhost(/motif-dev-<이름>)를 쓴다.
        auto-startup: false
